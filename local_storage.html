
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <textarea rows="10" cols="55" id="message"></textarea></br>

    <button id="saveButton">Save</button>

    <script>
       
        let textAreaElement = document.getElementById("message")
        let saveButtonElement = document.getElementById("saveButton")

        saveButtonElement.onclick = function(){
            let userEnteredText = textAreaElement.value 
            localStorage.setItem("userEnteredText" , userEnteredText)
        }

        let storeduserInputElement = localStorage.getItem("userEnteredText")
        if(storeduserInputElement === null){
            textAreaElement.value = ""
        }
        else{
            textAreaElement.value = storeduserInputElement
        }

        
    </script>
</body>
</html>
