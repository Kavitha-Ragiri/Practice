<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        
        .heading{
            margin-top: 150px;
            font-weight: 700;
            color: rgb(67, 3, 3);
            text-shadow: 0cap;
            font-size: 30px;
            text-align: center;
        }
        .inputSalary{
            width: 200px;
            height: 40px;
            border-radius: 5px;
            border-color: rgb(243, 30, 30);
            color: rgb(3, 0, 0);
            border-style: groove;
            font-weight: 600;
            margin: auto;
            
        }
        .resultButton{
            height: 40px;
            width: 100px;
            border: none;
            border-radius: 5px;
            background-color: rgb(243, 200, 10);
            color: black;
            font-weight: 700;
            margin: auto;
        }
        #yourSalary{
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: rgb(247, 26, 6);
            padding-top: 20px;
        }
        
            
    </style>
</head>

<body>
    <div class="taxConatainer ">
        <div class="inputContainer d-flex flex-column justify-content-center">
            <h1 class="heading">Tax Calculation</h1>
            <input class="inputSalary" type="text" id="input-salary"/></br>
            <input class="inputSalary" type="text" id="input-tax"/></br>
            <button class="resultButton" onclick="getResult()">Get</button>
        </div>
        <p id="yourSalary"></p>
    </div>



    <script>
        let salaryInputElement = document.getElementById("input-salary")
        let taxInputElement = document.getElementById("input-tax")
        let yourSalaryElement = document.getElementById("yourSalary")
       
        function getResult(){
            salaryInputElementValue = salaryInputElement.value
            taxInputElementValue = taxInputElement.value
            if(salaryInputElementValue < 90000){
                taxAmount = salaryInputElementValue * (10 / 100)
                yourSalaryAmount = salaryInputElementValue - taxAmount
                yourSalaryElement.innerHTML = "Your salary Amount is: " + yourSalaryAmount
            }
            else if(salaryInputElementValue >= 90000 && salaryInputElementValue <= 120000 ){
                taxAmount = salaryInputElementValue * (15 / 100)
                yourSalaryAmount = salaryInputElementValue - taxAmount
                yourSalaryElement.innerHTML = "Your salary Amount is: " + yourSalaryAmount
            }
            else if(salaryInputElementValue >= 120000 && salaryInputElementValue <= 150000 ){
                taxAmount = salaryInputElementValue * (20 / 100)
                yourSalaryAmount = salaryInputElementValue - taxAmount
                yourSalaryElement.innerHTML = "Your salary Amount is: " + yourSalaryAmount
            }
            else{
                taxAmount = salaryInputElementValue * (30 / 100)
                yourSalaryAmount = salaryInputElementValue - taxAmount
                yourSalaryElement.innerHTML = "Your salary Amount is: " + yourSalaryAmount
            }

        }
    </script>

</body>
</html>
