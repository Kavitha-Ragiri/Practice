<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Bree+Serif&family=Caveat:wght@400;700&family=Lobster&family=Monoton&family=Open+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display+SC:ital,wght@0,400;0,700;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+Pro:ital,wght@0,400;0,700;1,700&family=Work+Sans:ital,wght@0,400;0,700;1,700&display=swap");
 
 .dark-background {
   background-color: #0b0b0b;
 }
  
 .bulb-image {
   width: 150px;
 }
  
 .cat-image {
   width: 300px;
 }
  
 .switch-board {
   width: 294px;
   height: 200px;
   background-color: #7b8794;
   border-radius: 12px;
   padding-top: 32px;
   padding-bottom: 32px;
   padding-left: 16px;
   padding-right: 16px;
   margin: 16px;
 }
  
 .switch-status {
   font-family: "Roboto";
   font-weight: 500;
   font-size: 24px;
   color: #ffffff;
   margin-bottom: 24px;
 }
  
 .on-switch {
   font-family: "Roboto";
   font-weight: bold;
   font-size: 15px;
   color: #ffffff;
   border-radius: 8px;
   width: 100px;
   height: 44px;
   margin-left: 16px;
   background-color: #cbd2d9;
 }
  
 .off-switch {
   font-family: "Roboto";
   font-weight: bold;
   font-size: 15px;
   color: #ffffff;
   border-radius: 8px;
   width: 100px;
   height: 44px;
   background-color: #e12d39;
 }
 #num-times{
  font-size: 20px;
  font-weight: 400;
  font-style: italic;
 }
 .reset {
   font-family: "Roboto";
   font-weight: bold;
   font-size: 15px;
   color: #ffffff;
   border-radius: 8px;
   width: 100px;
   height: 44px;
   background-color: #090909;
  
 }
    </style>
</head>
<body>
    
    

    <div class="dark-background text-center">
        <div>
          <img
            src="https://d1tgh8fmlzexmh.cloudfront.net/ccbp-dynamic-webapps/bulb-go-on-img.png"
            class="bulb-image" id="bulbimage"
          />
        </div>
        <div>
          <img
            src="https://d1tgh8fmlzexmh.cloudfront.net/ccbp-dynamic-webapps/cat-img.png"
            class="cat-image" id="catimage"
          />
        </div>
        <div class="d-flex flex-row justify-content-center pt-5">
          <div class="switch-board">
            <h1 class="switch-status" id="switchstatus">Switched On</h1>
            <button class="off-switch" onclick="switchOff()" id="offSwitch">OFF<p id="Offtimes"></p></button>
            <button class="on-switch" onclick="switchOn()" id="onSwitch">ON<p id="Ontimes"></p></button>
            <button class="reset" id="re-set" onclick="reSet()">Reset</button>
          </div>
        </div>
        <p id="Offtimes"></p>
        <p id="Ontimes"></p>
      </div>





    <script>
          let count1=0;
        function switchOff(){
            let result1=document.getElementById("Offtimes");
            let btnele=document.getElementById("offSwitch")
            document.getElementById("bulbimage").src="https://d1tgh8fmlzexmh.cloudfront.net/ccbp-dynamic-webapps/bulb-go-off-img.png";
            document.getElementById("catimage").src="https://d1tgh8fmlzexmh.cloudfront.net/ccbp-dynamic-webapps/cat-eyes-img.png";
            document.getElementById("switchstatus").textContent="Switched Off"
            document.getElementById("onSwitch").style.backgroundColor = "#22c55e";
            document.getElementById("offSwitch").style.backgroundColor = "#cbd2d9";
            count1=parseInt(count1)+1;
            result1.innerHTML=count1 +" "+"times";
            result1.style.color="white"
            console.log(count1)
            result1.appendChild(btnele)
        }
            
          let count2=0
        function switchOn(){
          let result2=document.getElementById("Ontimes")
            document.getElementById("bulbimage").src= "https://d1tgh8fmlzexmh.cloudfront.net/ccbp-dynamic-webapps/bulb-go-on-img.png";
            document.getElementById("catimage").src="https://d1tgh8fmlzexmh.cloudfront.net/ccbp-dynamic-webapps/cat-img.png";
            document.getElementById("switchstatus").textContent="Switched On"
            document.getElementById("offSwitch").style.backgroundColor = "#e12d39";
            document.getElementById("onSwitch").style.backgroundColor = "#cbd2d9";
            count2=parseInt(count2)+1;
            result2.innerHTML=count2 +" "+"times";
            result2.style.color="white"
            console.log(count2)
            

        }
        
        function reSet(){
            document.getElementById("offSwitch").textContent="OFF"
            document.getElementById("onSwitch").textContent="ON"
        }
        

    </script>

</body>
</html>
